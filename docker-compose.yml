services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: password
      POSTGRES_DB: osint_ca
    ports:
      # Host-side port 5433, not 5432: several dev machines already have a local Postgres
      # bound to 5432, which makes this container fail to start with "port is already
      # allocated". Containers still talk to each other over the internal 5432 below.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  tor:
    image: dperson/torproxy
    ports:
      - "9050:9050"
      - "9051:9051"
    environment:
      - PASSWORD=changeme

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    ports:
      - "443:443"
    environment:
      - MISP_ADMIN_EMAIL=admin@osint.local
      - MISP_ADMIN_PASSPHRASE=changeme123!
    volumes:
      - mispdata:/var/www/MISP

  worker:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file: .env
    environment:
      # Override whatever DATABASE_URL/REDIS_URL are in .env: those are set for running
      # main.py locally against docker-compose's published ports (localhost:5432/6379).
      # Inside the compose network, "localhost" means the container itself, not the
      # postgres/redis services, so these containers could never actually reach the DB.
      - DATABASE_URL=postgresql://osint:password@postgres:5432/osint_ca
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    command: celery -A tasks.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://osint:password@postgres:5432/osint_ca
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://osint:password@postgres:5432/osint_ca
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres

volumes:
  pgdata:
  mispdata:
