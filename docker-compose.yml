version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: password
      POSTGRES_DB: osint_ca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  tor:
    image: dperson/torproxy
    ports:
      - "9050:9050"
      - "9051:9051"
    environment:
      - PASSWORD=changeme

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    ports:
      - "443:443"
    environment:
      - MISP_ADMIN_EMAIL=admin@osint.local
      - MISP_ADMIN_PASSPHRASE=changeme123!
    volumes:
      - mispdata:/var/www/MISP

  worker:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    command: celery -A tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - postgres

volumes:
  pgdata:
  mispdata:
